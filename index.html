<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0e1726" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Misturária</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/canvas.css" />
    <link rel="stylesheet" href="styles/drawer.css" />
    <link rel="stylesheet" href="styles/overlay.css" />
    <link rel="stylesheet" href="styles/arvore.css" />
    <link rel="stylesheet" href="styles/perfis.css" />
    <link rel="stylesheet" href="styles/ajustes.css" />
    <link rel="stylesheet" href="styles/modos.css" />
    <link rel="stylesheet" href="styles/eras.css" />
    <link rel="stylesheet" href="styles/carta.css" />
    <link rel="stylesheet" href="styles/barra.css" />
  </head>
  <body>
    <main id="jogo">
      <div id="barra" class="barra">
        <button id="perfil" class="barra-perfil" type="button">
          <span class="barra-avatar orbe"></span>
          <span class="barra-perfil-nome"></span>
        </button>
        <span id="rede" class="rede-status" data-online="sim"></span>
        <span class="barra-espaco"></span>
        <button id="arvore" class="barra-botao" type="button" aria-label="Árvore">🌳<span>Árvore</span></button>
        <button id="eras" class="barra-botao" type="button" aria-label="Álbum">🎴<span>Álbum</span></button>
        <button id="ajustes" class="barra-botao" type="button" aria-label="Ajustes">⚙️<span>Ajustes</span></button>
      </div>
      <section id="canvas" class="canvas"></section>
      <button id="limpar" class="botao-limpar" type="button" aria-label="Limpar canvas">🗑️</button>
      <aside id="drawer" class="drawer"></aside>
    </main>
    <div id="overlay-raiz"></div>
    <div id="arvore-raiz"></div>
    <div id="perfis-raiz"></div>
    <div id="ajustes-raiz"></div>
    <div id="eras-raiz"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
