<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1726" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Misturária</title>
    <style>body{background:#05070f;margin:0;}</style>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16-v2.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-v2.png" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/canvas.css" />
    <link rel="stylesheet" href="styles/drawer.css" />
    <link rel="stylesheet" href="styles/overlay.css" />
    <link rel="stylesheet" href="styles/arvore.css" />
    <link rel="stylesheet" href="styles/perfis.css" />
    <link rel="stylesheet" href="styles/ajustes.css" />
    <link rel="stylesheet" href="styles/modos.css" />
    <link rel="stylesheet" href="styles/eras.css" />
    <link rel="stylesheet" href="styles/carta.css" />
    <link rel="stylesheet" href="styles/barra.css" />
    <link rel="stylesheet" href="styles/splash.css" />
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-live="polite">
      <div class="splash-nebulosa" aria-hidden="true"></div>
      <div class="splash-estrelas" aria-hidden="true"></div>
      <div class="splash-nucleo">
        <div class="splash-orbita" aria-hidden="true"></div>
        <div class="splash-brilho" aria-hidden="true"></div>
        <img class="splash-mascote" src="assets/cartas/mascote.png" alt="" aria-hidden="true" />
        <img class="splash-logo" src="assets/cartas/logo-header.png" alt="Misturária" />
      </div>
      <p class="splash-tagline">Combine e crie tudo!</p>
      <p class="splash-status" id="splash-status"></p>
    </div>
    <script>
      // some antes mesmo do app.js (módulo, executa depois do parsing) rodar:
      // evita o flash do splash reaparecendo num reload interno (trocar de
      // perfil, ativar sync — ver src/app.js) dentro da mesma aba/sessão.
      try {
        if (sessionStorage.getItem('misturaria-splash-visto') === '1') {
          document.getElementById('splash').style.display = 'none';
        }
      } catch { /* sessionStorage indisponível: mostra o splash normalmente */ }
    </script>
    <main id="jogo">
      <div id="barra" class="barra">
        <button id="perfil" class="barra-perfil" type="button">
          <span class="barra-avatar orbe"></span>
          <span class="barra-perfil-nome"></span>
        </button>
        <span id="rede" class="rede-status" data-online="sim"></span>
        <span class="barra-espaco"></span>
        <img class="barra-logo" src="assets/cartas/logo-header.png" alt="" aria-hidden="true" />
        <button id="arvore" class="barra-botao" type="button" aria-label="Árvore">🌳<span>Árvore</span></button>
        <button id="eras" class="barra-botao" type="button" aria-label="Álbum">🎴<span>Álbum</span></button>
        <button id="ajustes" class="barra-botao" type="button" aria-label="Ajustes">⚙️<span>Ajustes</span></button>
      </div>
      <section id="canvas" class="canvas"></section>
      <button id="limpar" class="botao-limpar" type="button" aria-label="Limpar canvas">🗑️</button>
      <aside id="drawer" class="drawer"></aside>
    </main>
    <div id="overlay-raiz"></div>
    <div id="arvore-raiz"></div>
    <div id="perfis-raiz"></div>
    <div id="ajustes-raiz"></div>
    <div id="eras-raiz"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
